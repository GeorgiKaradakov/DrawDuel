services:
  db:
    image: postgres:16
    container_name: drawduel-db-prod
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drawduel-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: drawduel-backend
    depends_on:
      - db
    env_file:
      - backend/infrastructure/.env.docker
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - DB_HOST=db
    ports:
      - "8080:8080"
    networks:
      - drawduel-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: drawduel-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - drawduel-net

volumes:
  postgres_data:

networks:
  drawduel-net:
