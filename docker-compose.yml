version: "3.9"

services:
  db:
    image: postgres:16
    container_name: drawduel-db
    env_file:
      - .env.db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - drawduel-net
    restart: unless-stopped

  backend:
    image: gkaradakov/drawduel-backend:latest
    container_name: drawduel-backend
    depends_on:
      - db
    env_file:
      - backend/infrastructure/.env.docker
    environment:
      SPRING_PROFILES_ACTIVE: docker
      DB_HOST: db
    ports:
      - "8080:8080"
    networks:
      - drawduel-net
    restart: unless-stopped

  frontend:
    image: gkaradakov/drawduel-frontend:latest
    container_name: drawduel-frontend
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - drawduel-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  drawduel-net:
    external: true
