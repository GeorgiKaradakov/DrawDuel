stages:
  - test_fast
  - test_integration
  - build

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
  SPRING_PROFILES_ACTIVE: "test"
  TESTCONTAINERS_RYUK_DISABLED: "true"
  DOCKER_HOST: "unix:///var/run/docker.sock"

cache:
  key: gradle-cache
  paths:
    - backend/.gradle/wrapper
    - backend/.gradle/caches

unit_tests:
  stage: test_fast
  before_script:
    - cd backend
  script:
    - echo "⚡ Running unit tests..."
    - gradle :tests:test --tests "*ServiceTest" --tests "*UseCaseTest" --rerun-tasks
  tags:
    - tests
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/
  only:
    - dev
    - main
    - merge_requests

integration_tests:
  stage: test_integration
  before_script:
    - cd backend/tests
    # Load .env variables into the environment
    - export $(grep -v '^#' .env | xargs)
    - cd ..
  script:
    - echo "🐘 Running integration + controller tests with Testcontainers..."
    - gradle :tests:test --tests "*IntegrationTest" --tests "*ControllerTest" --rerun-tasks
  tags:
    - tests
  artifacts:
    when: always
    reports:
      junit: backend/build/test-results/test/
  needs:
    - job: unit_tests
      artifacts: false
  only:
    - dev
    - main
    - merge_requests

build_backend:
  stage: build
  before_script:
    - cd backend
  script:
    - echo "🏗️ Building backend after successful tests..."
    - gradle clean build -x test
  tags:
    - build
  artifacts:
    paths:
      - backend/build/libs/
    expire_in: 1 week
  needs:
    - job: integration_tests
      artifacts: false
  only:
    - dev
    - main
    - merge_requests
